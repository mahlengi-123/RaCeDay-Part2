name: raceday-part3
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run the setup script first}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
  banner-api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      BannerApi__ApiKey: ${BANNER_API_KEY:?Run the setup script first}
      AzureBlob__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:?Configure Azure first}
      AzureBlob__ContainerName: ${AZURE_BLOB_CONTAINER_NAME:-event-banners}
    ports:
      - "127.0.0.1:5082:8080"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RaceDay_Part3_Docker;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      BannerApi__BaseUrl: http://banner-api:8080/
      BannerApi__ApiKey: ${BANNER_API_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - profile-images:/app/wwwroot/uploads/profiles
      - web-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
      banner-api:
        condition: service_started
volumes:
  sql-data:
  profile-images:
  web-keys:
